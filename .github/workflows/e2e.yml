name: End-to-end

# The end-to-end battery (tests/e2e/run.py): every feature driven through its real windows from the main menu,
# on real footage, the outputs checked with ffprobe. On Linux in a virtual display, and on Windows.
# Left out: the full upscalings (Real-ESRGAN without GPU: about 15 minutes for 2 seconds of video) and the real
# Google Translate (it may refuse the requests of the runners); the speed measure of Real-ESRGAN runs on Linux
# with a software Vulkan driver. The outputs of the scenarios are kept as an artifact when one fails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            scenarios: compress translate-film translate-batch translate-not translate-deepl audio add upscale-refused
          - os: windows-latest
            scenarios: compress translate-film translate-batch translate-not translate-deepl audio add
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install FFmpeg, a virtual display and a software Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ffmpeg xvfb mesa-vulkan-drivers libvulkan1 libgomp1
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: pip install -r requirements.txt
      - name: Real-ESRGAN (Linux)
        if: runner.os == 'Linux'
        run: python scripts/fetch_deps.py
      - name: Test media (downloaded once, SHA-256 checked)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/videotoolbox_e2e/media
          key: e2e-media-${{ runner.os }}-${{ hashFiles('tests/e2e/media.py') }}
      - name: Battery
        shell: bash
        env:
          # The test media and the outputs go to the temporary folder of the system (Python reads TMPDIR first):
          # the one of the runner, whose media folder is cached
          TMPDIR: ${{ runner.temp }}
        run: python tests/e2e/run.py ${{ matrix.scenarios }}
      - name: Outputs of the scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-work-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/videotoolbox_e2e/work/*/log.txt
            ${{ runner.temp }}/videotoolbox_e2e/work/*/result.json
            ${{ runner.temp }}/videotoolbox_e2e/work/report.json
          retention-days: 14
