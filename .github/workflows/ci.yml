name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A stuck package installation (seen with apt-get) fails after 20 minutes instead of 6 hours
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"  # oldest supported version
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install FFmpeg and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: pip install -r requirements-dev.txt
      # -rs lists the skipped tests, e.g. the integration tests when FFmpeg is missing; the window tests
      # (test_gui_windows.py) need a display: a virtual one on Linux
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -rs
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -rs
