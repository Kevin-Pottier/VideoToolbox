# Tool configuration only: VideoToolbox is run with `python main.py`, it is not a package.

[tool.ruff]
target-version = "py39"
extend-exclude = ["Tool"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports and variables...) and syntax errors
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.coverage.run]
# The code of the application (python -m pytest --cov=.), not the tests
omit = ["tests/*", "Tool/*"]
